<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انضم إلى UFOQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --paper: #F6F4F1;
            --stone: #E4DED2;
            --coral: #F95C4B;
            --black: #000000;
            --bg: var(--paper);
            --glass: var(--coral);
            --btn: var(--coral);
            --glass-light: rgba(249, 92, 75, 0.08);
            --glass-border: rgba(249, 92, 75, 0.18);
            --text: var(--black);
            --text-dim: #5A5652;
            --text-faint: #8A8580;
            --white: #FFFFFF;
            --stone-light: rgba(228, 222, 210, 0.5);
            --stone-border: rgba(228, 222, 210, 0.8);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .auth-card {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            background: rgba(246, 244, 241, 0.7);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid var(--stone-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 1;
        }

        .card-visual {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px;
            overflow: hidden;
            background: linear-gradient(160deg, rgba(249,92,75,0.04) 0%, rgba(228,222,210,0.3) 100%);
        }
        .visual-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: var(--text);
        }

        .logo-ring {
            position: relative;
            width: 100px; height: 100px;
            margin: 0 auto 16px;
        }
        .logo-core {
            position: absolute;
            inset: 16px;
            background: var(--glass);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(249, 92, 75, 0.2);
            animation: corePulse 3s ease-in-out infinite;
            z-index: 2;
        }
        .logo-core i { font-size: 32px; color: white; }
        @keyframes corePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 20px rgba(249,92,75,0.2); }
            50% { transform: scale(1.05); box-shadow: 0 12px 30px rgba(249,92,75,0.3); }
        }
        .ring {
            position: absolute;
            border: 2px solid rgba(249, 92, 75, 0.12);
            border-radius: 50%;
            inset: 0;
            animation: ringExpand 3s ease-out infinite;
        }
        .ring-1 { animation-delay: 0s; }
        .ring-2 { animation-delay: 1s; border-color: rgba(249, 92, 75, 0.08); }
        .ring-3 { animation-delay: 2s; border-color: rgba(249, 92, 75, 0.06); }
        @keyframes ringExpand {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .visual-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 4px;
            color: var(--text);
        }
        .visual-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
        }
        .feature-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
            border: 1px solid var(--stone-border);
            transition: all 0.2s ease;
            animation: slideInLeft 0.5s ease-out backwards;
        }
        .feature-row:nth-child(1) { animation-delay: 0.1s; }
        .feature-row:nth-child(2) { animation-delay: 0.2s; }
        .feature-row:nth-child(3) { animation-delay: 0.3s; }
        .feature-row:nth-child(4) { animation-delay: 0.4s; }
        .feature-row:hover {
            background: rgba(255,255,255,0.8);
            transform: translateX(-4px);
            border-color: var(--stone-border);
        }
        .feature-row span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }
        .feature-icon {
            width: 28px; height: 28px;
            min-width: 28px;
            background: rgba(249, 92, 75, 0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feature-icon i { font-size: 14px; color: var(--glass); }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .card-form {
            flex: 1;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .form-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .form-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }
        .form-header p {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 400;
        }

        .input-wrap {
            margin-bottom: 16px;
            position: relative;
        }
        .input-wrap label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .input-wrap label i { font-size: 14px; color: var(--glass); }
        .input-wrap input {
            width: 100%;
            padding: 12px 14px;
            padding-left: 40px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--stone-border);
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }
        .input-wrap input::placeholder { color: var(--text-faint); }
        .input-wrap input:focus {
            border-color: var(--coral);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(249, 92, 75, 0.1);
        }
        .toggle-pass {
            position: absolute;
            left: 10px;
            bottom: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-faint);
            transition: color 0.2s;
        }
        .toggle-pass:hover { color: var(--text-dim); }
        .toggle-pass i { font-size: 16px; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            background: var(--btn);
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .submit-btn:active { transform: scale(0.96); }
        .submit-btn.loading .btn-text,
        .submit-btn.loading .btn-arrow { opacity: 0; }
        .btn-loader {
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            opacity: 0;
        }
        .submit-btn.loading .btn-loader { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-arrow { font-size: 15px; transition: transform 0.2s ease; }
        .submit-btn:hover .btn-arrow { transform: translateX(-3px); }

        .form-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .switch-btn {
            background: none;
            border: none;
            color: var(--glass);
            font-family: 'Tajawal', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 4px;
            transition: color 0.2s;
            position: relative;
        }
        .switch-btn::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0; right: 0;
            height: 1px;
            background: var(--glass);
            transform: scaleX(0);
            transition: transform 0.3s ease;
            transform-origin: right;
        }
        .switch-btn:hover::after { transform: scaleX(1); }
        .switch-btn:hover { color: var(--glass); }

        .error-toast {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.15);
            color: #dc2626;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            white-space: nowrap;
        }
        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .error-toast i { font-size: 16px; flex-shrink: 0; }

        .form-fade { opacity: 0; pointer-events: none; }

        @media (max-width: 768px) {
            .auth-card {
                flex-direction: column;
                max-width: 420px;
                min-height: auto;
            }
            .card-visual {
                padding: 24px 18px;
                min-height: 240px;
            }
            .logo-ring { width: 80px; height: 80px; }
            .logo-core { inset: 12px; border-radius: 16px; }
            .logo-core i { font-size: 26px; }
            .visual-title { font-size: 20px; }
            .feature-list {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }
            .feature-row {
                padding: 7px 10px;
                flex: 0 0 auto;
            }
            .feature-row span { font-size: 11px; }
            .card-form { padding: 24px 20px; }
        }
        @media (max-width: 380px) {
            body { padding: 12px; }
            .card-visual { padding: 18px 14px; }
            .card-form { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="card-visual">
            <div class="visual-content">
                <div class="logo-ring">
                    <div class="logo-core"><i class="bi bi-magic"></i></div>
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                </div>
                <h2 class="visual-title">UFOQ</h2>
                <p class="visual-subtitle">اصنع محتواك الآن</p>

                <div class="feature-list">
                    <div class="feature-row">
                        <div class="feature-icon"><i class="bi bi-pencil"></i></div>
                        <span>كاتب إعلانات ذكي</span>
                    </div>
                    <div class="feature-row">
                        <div class="feature-icon"><i class="bi bi-layers"></i></div>
                        <span>أنماط متعددة للتوليد</span>
                    </div>
                    <div class="feature-row">
                        <div class="feature-icon"><i class="bi bi-gift"></i></div>
                        <span>هدية يومية + تحويل نقاط</span>
                    </div>
                    <div class="feature-row">
                        <div class="feature-icon"><i class="bi bi-stars"></i></div>
                        <span>10 نقاط مجانية للبداية</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-form">
            <div class="form-header">
                <h1 id="formTitle">تسجيل الدخول</h1>
                <p id="formDesc">أهلاً بعودتك! سجل دخولك للمتابعة</p>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="input-wrap">
                    <label for="username"><i class="bi bi-person"></i> اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                </div>

                <div class="input-wrap">
                    <label for="password"><i class="bi bi-lock"></i> كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-pass" onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                    <span class="btn-loader"></span>
                    <i class="bi bi-arrow-left btn-arrow"></i>
                </button>
            </form>

            <div class="form-footer">
                <span id="footerText">ليس لديك حساب؟</span>
                <button type="button" class="switch-btn" id="switchBtn" onclick="toggleMode()">أنشئ حساباً</button>
            </div>

            <div class="error-toast" id="errorToast">
                <i class="bi bi-exclamation-circle"></i>
                <span id="errorText">حدث خطأ ما</span>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            const form = document.getElementById('authForm');
            const title = document.getElementById('formTitle');
            const desc = document.getElementById('formDesc');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const footerText = document.getElementById('footerText');
            const switchBtn = document.getElementById('switchBtn');

            form.classList.add('form-fade');

            setTimeout(() => {
                isLogin = !isLogin;
                if (isLogin) {
                    title.textContent = 'تسجيل الدخول';
                    desc.textContent = 'أهلاً بعودتك! سجل دخولك للمتابعة';
                    btnText.textContent = 'تسجيل الدخول';
                    footerText.textContent = 'ليس لديك حساب؟';
                    switchBtn.textContent = 'أنشئ حساباً';
                    document.getElementById('password').setAttribute('autocomplete', 'current-password');
                } else {
                    title.textContent = 'إنشاء حساب';
                    desc.textContent = 'انضم إلينا وابدأ رحلتك الإبداعية';
                    btnText.textContent = 'إنشاء حساب';
                    footerText.textContent = 'لديك حساب بالفعل؟';
                    switchBtn.textContent = 'سجل دخولك';
                    document.getElementById('password').setAttribute('autocomplete', 'new-password');
                }
                form.classList.remove('form-fade');
            }, 300);
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('submitBtn');
            const errorToast = document.getElementById('errorToast');
            const errorText = document.getElementById('errorText');

            errorToast.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;

            const endpoint = isLogin ? '/api/login' : '/api/signup';

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                btn.classList.remove('loading');
                btn.disabled = false;
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorText.textContent = data.message || 'حدث خطأ ما، حاول مرة أخرى';
                    errorToast.classList.add('show');
                    setTimeout(() => errorToast.classList.remove('show'), 4000);
                }
            })
            .catch(() => {
                btn.classList.remove('loading');
                btn.disabled = false;
                errorText.textContent = 'تعذر الاتصال بالخادم';
                errorToast.classList.add('show');
                setTimeout(() => errorToast.classList.remove('show'), 4000);
            });
        }
    </script>
</body>
</html>
