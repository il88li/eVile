<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول – UFOQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0f0c1d;
            --bg-card: rgba(30,24,52,0.6);
            --glass-border: rgba(255,255,255,0.1);
            --text: #f7f5ff;
            --text-dim: #a79fc4;
            --text-faint: #6f6790;
            --primary: #ffb454;
            --primary-dim: rgba(255,180,84,0.15);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(145deg, #0f0c1d 0%, #1a1330 100%);
            color: var(--text);
            min-height: 100vh;
            display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        .auth-card {
            display:flex; width:100%; max-width:900px; min-height:520px;
            background:var(--bg-card);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--glass-border);
            border-radius:24px;
            overflow:hidden;
            box-shadow:var(--shadow);
        }
        .card-visual {
            flex:1; padding:36px; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:rgba(255,180,84,0.03);
            border-left:1px solid var(--glass-border);
        }
        .logo-ring {
            position:relative; width:100px; height:100px; margin-bottom:16px;
        }
        .logo-core {
            position:absolute; inset:16px;
            background:var(--primary); border-radius:20px;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 8px 20px rgba(255,180,84,0.3);
            animation:corePulse 3s ease-in-out infinite;
        }
        .logo-core i { font-size:32px; color:#0f0c1d; }
        @keyframes corePulse {
            0%,100%{ transform:scale(1); box-shadow:0 8px 20px rgba(255,180,84,0.3); }
            50%{ transform:scale(1.05); box-shadow:0 12px 30px rgba(255,180,84,0.5); }
        }
        .ring {
            position:absolute; border:2px solid rgba(255,180,84,0.15); border-radius:50%;
            inset:0; animation:ringExpand 3s ease-out infinite;
        }
        .ring-1{ animation-delay:0s; }
        .ring-2{ animation-delay:1s; border-color:rgba(255,180,84,0.08); }
        .ring-3{ animation-delay:2s; border-color:rgba(255,180,84,0.05); }
        @keyframes ringExpand {
            0%{ transform:scale(0.8); opacity:1; }
            100%{ transform:scale(1.4); opacity:0; }
        }
        .visual-title { font-size:28px; font-weight:900; letter-spacing:2px; }
        .visual-subtitle { font-size:13px; color:var(--text-dim); margin-bottom:20px; }
        .feature-list { display:flex; flex-direction:column; gap:8px; width:100%; }
        .feature-row {
            display:flex; align-items:center; gap:10px;
            padding:9px 14px; background:rgba(255,255,255,0.03);
            border-radius:12px; border:1px solid var(--glass-border);
        }
        .feature-row i { color:var(--primary); font-size:16px; }

        .card-form {
            flex:1; padding:40px 36px; display:flex; flex-direction:column;
            justify-content:center;
        }
        .form-header { text-align:center; margin-bottom:24px; }
        .form-header h1 { font-size:22px; font-weight:800; }
        .form-header p { font-size:13px; color:var(--text-dim); }

        .input-wrap { margin-bottom:16px; position:relative; }
        .input-wrap label {
            display:block; font-size:11px; font-weight:700;
            color:var(--text-dim); margin-bottom:6px;
        }
        .input-wrap input {
            width:100%; padding:12px 14px; padding-left:40px;
            background:rgba(255,255,255,0.05); border:1px solid var(--glass-border);
            border-radius:12px; color:var(--text); font-family:'Tajawal',sans-serif;
            font-size:14px; outline:none; transition:0.2s;
        }
        .input-wrap input:focus { border-color:var(--primary); background:rgba(255,255,255,0.08); }
        .toggle-pass {
            position:absolute; left:10px; bottom:10px;
            background:none; border:none; color:var(--text-faint); cursor:pointer;
        }
        .submit-btn {
            width:100%; padding:12px; margin-top:4px;
            background:var(--primary); border:none; border-radius:12px;
            color:#0f0c1d; font-family:'Tajawal',sans-serif;
            font-size:15px; font-weight:700; cursor:pointer;
            transition:0.2s; display:flex; align-items:center;
            justify-content:center; gap:8px;
        }
        .submit-btn:hover { opacity:0.85; transform:scale(1.02); }
        .submit-btn:active { transform:scale(0.96); }
        .form-footer {
            text-align:center; margin-top:18px; font-size:12px; color:var(--text-dim);
        }
        .switch-btn {
            background:none; border:none; color:var(--primary);
            font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;
        }
        .switch-btn:hover { text-decoration:underline; }
        .error-toast {
            position:absolute; bottom:16px; left:50%; transform:translateX(-50%) translateY(20px);
            background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2);
            color:#f87171; padding:10px 16px; border-radius:12px;
            font-size:12px; font-weight:600; opacity:0; transition:0.4s;
            display:flex; align-items:center; gap:6px;
            pointer-events:none;
        }
        .error-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        @media (max-width:768px) {
            .auth-card { flex-direction:column; max-width:420px; min-height:auto; }
            .card-visual { padding:24px; border-left:none; border-bottom:1px solid var(--glass-border); }
            .card-form { padding:24px 20px; }
            .logo-ring { width:80px; height:80px; }
            .logo-core { inset:12px; }
            .logo-core i { font-size:26px; }
        }
    </style>
</head>
<body>
    <a href="/" style="position:fixed; top:20px; right:20px; width:40px; height:40px; border-radius:12px; background:var(--bg-card); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; color:var(--text-dim); text-decoration:none; z-index:10;"><i class="bi bi-x-lg"></i></a>
    <div class="auth-card">
        <div class="card-visual">
            <div class="logo-ring">
                <div class="logo-core"><i class="bi bi-magic"></i></div>
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
            <h2 class="visual-title">UFOQ</h2>
            <p class="visual-subtitle">سجل الدخول للوصول إلى إعداداتك</p>
            <div class="feature-list">
                <div class="feature-row"><i class="bi bi-person"></i> <span>حساب شخصي</span></div>
                <div class="feature-row"><i class="bi bi-image"></i> <span>رفع صورة الملف الشخصي</span></div>
                <div class="feature-row"><i class="bi bi-pencil"></i> <span>برومبت مخصص</span></div>
                <div class="feature-row"><i class="bi bi-tags"></i> <span>كلمات مفتاحية للبحث</span></div>
            </div>
        </div>

        <div class="card-form" style="position:relative;">
            <div class="form-header">
                <h1 id="formTitle">تسجيل الدخول</h1>
                <p id="formDesc">أهلاً بعودتك</p>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="input-wrap">
                    <label for="username"><i class="bi bi-person"></i> اسم المستخدم</label>
                    <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="username">
                </div>
                <div class="input-wrap">
                    <label for="password"><i class="bi bi-lock"></i> كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-pass" onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                    <i class="bi bi-arrow-left btn-arrow"></i>
                </button>
            </form>

            <div class="form-footer">
                <span id="footerText">ليس لديك حساب؟</span>
                <button type="button" class="switch-btn" id="switchBtn" onclick="toggleMode()">أنشئ حساباً</button>
            </div>

            <div class="error-toast" id="errorToast">
                <i class="bi bi-exclamation-circle"></i>
                <span id="errorText">حدث خطأ</span>
            </div>
        </div>
    </div>

    <script>
        const CSRF_TOKEN = "{{ csrf_token }}";
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('formTitle');
            const desc = document.getElementById('formDesc');
            const btnText = document.querySelector('.btn-text');
            const footerText = document.getElementById('footerText');
            const switchBtn = document.getElementById('switchBtn');
            if (isLogin) {
                title.textContent = 'تسجيل الدخول';
                desc.textContent = 'أهلاً بعودتك';
                btnText.textContent = 'تسجيل الدخول';
                footerText.textContent = 'ليس لديك حساب؟';
                switchBtn.textContent = 'أنشئ حساباً';
            } else {
                title.textContent = 'إنشاء حساب';
                desc.textContent = 'انضم إلينا';
                btnText.textContent = 'إنشاء حساب';
                footerText.textContent = 'لديك حساب بالفعل؟';
                switchBtn.textContent = 'سجل دخولك';
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('submitBtn');
            const toast = document.getElementById('errorToast');
            const errorText = document.getElementById('errorText');

            toast.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-text">جاري...</span>';

            const action = isLogin ? 'login' : 'signup';

            fetch('/sign', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, action, csrf_token: CSRF_TOKEN })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-text">${isLogin ? 'تسجيل الدخول' : 'إنشاء حساب'}</span> <i class="bi bi-arrow-left btn-arrow"></i>`;
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorText.textContent = data.message || 'حدث خطأ';
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 4000);
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-text">${isLogin ? 'تسجيل الدخول' : 'إنشاء حساب'}</span> <i class="bi bi-arrow-left btn-arrow"></i>`;
                errorText.textContent = 'تعذر الاتصال بالخادم';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
            });
        }
    </script>
</body>
</html>
