<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الإعدادات – UFOQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --bg: #0b0e1a;
            --bg-card: rgba(20,30,48,0.6);
            --glass-border: rgba(255,255,255,0.1);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --text-faint: #64748b;
            --primary: #38bdf8;
            --primary-dim: rgba(56,189,248,0.15);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --danger: #f87171;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #111827 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 90px 16px 140px 16px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 1.2rem; font-weight: 800; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .card-title i { color: var(--primary); }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 700;
            color: var(--text-dim); margin-bottom: 8px;
        }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 14px; color: var(--text); font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary); background: rgba(255,255,255,0.08);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 14px;
            font-family: 'Tajawal', sans-serif; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: #0b0e1a; }
        .btn-primary:hover { opacity: 0.85; transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .image-preview {
            width: 100%; max-width: 200px; margin: 0 auto 16px;
            border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border);
            display: none;
        }
        .image-preview img { width: 100%; display: block; }
        .file-input-wrapper {
            position: relative; overflow: hidden; display: inline-block; width: 100%;
        }
        .file-input-wrapper input[type=file] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .file-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border: 2px dashed var(--glass-border);
            border-radius: 14px; color: var(--text-dim); font-weight: 600;
            transition: 0.2s;
        }
        .file-input-wrapper:hover .file-btn {
            border-color: var(--primary); color: var(--primary); background: var(--primary-dim);
        }
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); color: var(--text);
            padding: 12px 24px; border-radius: 50px; font-weight: 700;
            z-index: 2000; opacity: 0; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
            font-family: 'Tajawal', sans-serif;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: rgba(74,222,128,0.3); color: #4ade80; }
        .toast.error { border-color: rgba(248,113,113,0.3); color: var(--danger); }
        .hint {
            font-size: 0.8rem; color: var(--text-faint); margin-top: 10px;
            display: flex; align-items: center; gap: 6px; justify-content: center;
        }
        .bottom-nav-bar {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; align-items: center; gap: 6px;
            padding: 10px 18px; background: rgba(11,14,26,0.8);
            backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
            border-radius: 50px; box-shadow: var(--shadow);
            max-width: 600px; width: auto;
        }
        .nav-item {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 20px; border-radius: 40px;
            background: transparent; border: none; color: var(--text-faint);
            font-family: 'Tajawal', sans-serif; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s; text-decoration: none; white-space: nowrap;
        }
        .nav-item:hover { color: var(--text); background: var(--primary-dim); }
        .nav-item.active { background: var(--primary); color: #0b0e1a; border: 1px solid var(--primary); }
        .nav-item i { font-size: 20px; }
        .nav-label { max-width: 0; overflow: hidden; transition: 0.2s; opacity: 0; }
        .nav-item.active .nav-label { max-width: 80px; opacity: 1; }
        @media (max-width: 600px) {
            .bottom-nav-bar { padding: 6px 12px; max-width: 95vw; }
            .nav-item { padding: 6px 14px; font-size: 12px; }
            .nav-item i { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile -->
        <div class="glass-card">
            <div class="card-title"><i class="bi bi-person-circle"></i> الملف الشخصي</div>
            <div class="image-preview" id="imagePreview" style="display: {% if user and user.profile_image %}block{% else %}none{% endif %};">
                {% if user and user.profile_image %}<img src="{{ user.profile_image }}" alt="Profile">{% endif %}
            </div>
            <div class="file-input-wrapper">
                <div class="file-btn"><i class="bi bi-cloud-upload"></i> <span id="fileLabel">رفع صورة</span></div>
                <input type="file" id="profileImage" accept="image/*" onchange="handleImageSelect(this)">
            </div>
            <div class="form-group" style="margin-top: 16px;">
                <label>اسم المستخدم</label>
                <input type="text" value="{{ user.username if user else '' }}" readonly>
            </div>
        </div>

        <!-- Submit Prompt -->
        <div class="glass-card">
            <div class="card-title"><i class="bi bi-plus-circle"></i> إرسال برومبت للمكتبة</div>
            <div class="form-group">
                <label>عنوان البرومبت</label>
                <input type="text" id="promptTitle" placeholder="مثال: شعار إسلامي فاخر">
            </div>
            <div class="form-group">
                <label>رابط الصورة (اختياري)</label>
                <input type="url" id="promptImageUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>برومبت الصورة</label>
                <textarea id="promptText" placeholder="اكتب البرومبت الكامل هنا..."></textarea>
            </div>
            <div class="form-group">
                <label>كلمات مفتاحية (لتسهيل البحث)</label>
                <input type="text" id="promptKeywords" placeholder="شعار، إسلامي، ذهبي، فاخر">
            </div>
            <button class="btn btn-primary" onclick="submitPrompt()" id="submitBtn">
                <i class="bi bi-send"></i> إرسال للمراجعة
            </button>
            <div class="hint">
                <i class="bi bi-shield-check"></i>
                يتم فحص البرومبتات تلقائياً قبل النشر لحماية المكتبة.
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="bi bi-check-lg"></i> <span id="toastMsg">تم!</span></div>

    <nav class="bottom-nav-bar">
        <a href="/" class="nav-item"><i class="bi bi-house-door"></i><span class="nav-label">الرئيسية</span></a>
        <a href="/library" class="nav-item"><i class="bi bi-collection"></i><span class="nav-label">المكتبة</span></a>
        <a href="/settings" class="nav-item active"><i class="bi bi-gear-fill"></i><span class="nav-label">الإعدادات</span></a>
    </nav>

    <script>
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function handleImageSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('fileLabel').textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = '<img src="' + e.target.result + '">';
                    preview.style.display = 'block';
                    uploadImage(file);
                };
                reader.readAsDataURL(file);
            }
        }

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);
            formData.append('csrf_token', '{{ csrf_token }}');
            try {
                const res = await fetch('/api/upload_image', { method: 'POST', body: formData });
                const data = await res.json();
                showToast(data.success ? 'تم رفع الصورة' : (data.message || 'فشل الرفع'), data.success ? 'success' : 'error');
            } catch (e) { showToast('خطأ في الاتصال', 'error'); }
        }

        async function submitPrompt() {
            const title = document.getElementById('promptTitle').value.trim();
            const imageUrl = document.getElementById('promptImageUrl').value.trim();
            const promptText = document.getElementById('promptText').value.trim();
            const keywords = document.getElementById('promptKeywords').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!title || !promptText) {
                showToast('يرجى ملء العنوان والبرومبت', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري الإرسال...';

            try {
                const res = await fetch('/api/submit_prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        image_url: imageUrl || null,
                        prompt_text: promptText,
                        keywords: keywords || null,
                        csrf_token: '{{ csrf_token }}'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('تم الإرسال للمراجعة بنجاح!');
                    document.getElementById('promptTitle').value = '';
                    document.getElementById('promptImageUrl').value = '';
                    document.getElementById('promptText').value = '';
                    document.getElementById('promptKeywords').value = '';
                } else {
                    showToast(data.message || 'فشل الإرسال', 'error');
                }
            } catch (e) {
                showToast('خطأ في الاتصال', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send"></i> إرسال للمراجعة';
            }
        }
    </script>
</body>
</html>
